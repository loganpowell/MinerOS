[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mineros"
dynamic = ["version"]
license = { text = "Apache-2.0" }
description = "Apache 2.0 document parsing engine: PDF/DOCX/images → Markdown/JSON with tracked-changes (strikethrough) support"
readme = "README.md"
requires-python = ">=3.10,<3.14"
keywords = ["mineros", "pdf", "markdown", "document-parsing", "ocr", "vlm", "strikethrough", "tracked-changes"]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "boto3>=1.28.43",
    "click>=8.1.7",
    "loguru>=0.7.2",
    "numpy>=1.21.6",
    "pdfminer.six>=20251230",
    "tqdm>=4.67.1",
    "requests",
    "httpx",
    "pillow>=11.0.0",
    "pypdfium2>=4.30.0",
    "pypdf>=5.6.0",
    "reportlab",
    "pdftext>=0.6.3",
    "modelscope>=1.26.0",
    "huggingface-hub>=0.32.4",
    "json-repair>=0.46.2",
    "opencv-python>=4.11.0.86",
    "fast-langdetect>=0.2.3,<0.3.0",
    "scikit-image>=0.25.0,<1.0.0",
    "openai>=1.70.0,<3",
    "beautifulsoup4>=4.13.5,<5",
    "magika>=0.6.2,<1.1.0",
    "mineru-vl-utils>=0.2.3,<1",
    "qwen-vl-utils>=0.0.14,<1",
    "python-docx>=1.2.0,<2",
    'pypptx-with-oxml>=1.0.3,<2',
    "mammoth>=1.11.0,<2",
    "pylatexenc>=2.10,<3",
    "lxml>=4.0.0,<7.0.0",
    "pandas>=2.3.3,<3",
    "openpyxl>=3.1.5,<4",
    "fastapi",
    "python-multipart",
    "uvicorn",
]

[project.optional-dependencies]
test = [
    "mineros[core]",
    "pytest",
    "pytest-cov",
    "coverage",
    "fuzzywuzzy"
]
dev = [
    "mineros[test]",
    "ruff",
    "pylint",
]
vlm = [
    "torch>=2.6.0,<3",
    "transformers>=4.57.3,<5.0.0",
    "accelerate>=1.5.1",
]
vllm = [
    "vllm>=0.10.1.1,<0.12",
]
lmdeploy = [
    "lmdeploy>=0.10.2,<0.12",
]
mlx = [
    "mlx-vlm>=0.3.3,<0.4",
]
pipeline = [
    "dill>=0.3.8,<1",
    "PyYAML>=6.0.1,<7",
    "ftfy>=6.3.1,<7",
    "shapely>=2.0.7,<3",
    "pyclipper>=1.3.0,<2",
    "omegaconf>=2.3.0,<3",
    "torch>=2.6.0,<3",
    "torchvision",
    "transformers>=4.57.3,<5.0.0",
    "onnxruntime>1.17.0",
    "albumentations>=2.0.8,<3",
]
gradio = [
    "gradio>=5.49.1,!=6.0.0,!=6.0.1,!=6.0.2,!=6.1.0,!=6.2.0,!=6.3.0,!=6.4.0,!=6.5.0,!=6.5.1,!=6.6.0,!=6.7.0,<6.9.0",
    "gradio-pdf>=0.0.22",
]
core = [
    "mineros[vlm]",
    "mineros[pipeline]",
    "mineros[gradio]",
]
all = [
    "mineros[core]",
    "mineros[mlx] ; sys_platform == 'darwin'",
    "mineros[vllm] ; sys_platform == 'linux'",
    "mineros[lmdeploy] ; sys_platform == 'win32'",
]

[project.urls]
homepage = "https://github.com/loganpowell/MinerOS"
repository = "https://github.com/loganpowell/MinerOS"
issues = "https://github.com/loganpowell/MinerOS/issues"

[project.scripts]
mineros = "mineros.cli.client:main"
mineros-vllm-server = "mineros.cli.vlm_server:vllm_server"
mineros-lmdeploy-server = "mineros.cli.vlm_server:lmdeploy_server"
mineros-openai-server = "mineros.cli.vlm_server:openai_server"
mineros-models-download = "mineros.cli.models_download:download_models"
mineros-api = "mineros.cli.fast_api:main"
mineros-router = "mineros.cli.router:main"
mineros-gradio = "mineros.cli.gradio_app:main"

[tool.setuptools.dynamic]
version = { attr = "mineros.version.__version__" }

[tool.setuptools.packages.find]
include = ["mineros*"]
namespaces = false

[tool.setuptools.package-data]
"mineros" = ["resources/**"]
"mineros.model.utils.pytorchocr.utils" = ["resources/**"]

[tool.setuptools]
include-package-data = true
zip-safe = false

[tool.ruff]
line-length = 120
exclude = [
    "mineros/model/utils/pytorchocr",
]

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = [
    "E402",   # module-level import not at top (intentional in gradio_app.py)
    "E501",   # line too long (handled by formatter)
]

[tool.pytest.ini_options]
addopts = "-s --cov=mineros --cov-report html"

[tool.coverage.run]
command_line = "-m pytest tests/unittest/test_e2e.py"
source = ["mineros/"]
omit = [
    "*/gradio_app.py",
    "*/models_download.py",
    "*/fast_api.py",
    "*/cli/client.py",
    "*/vlm_vllm_server.py",
    "*/cli_parser.py",
]

[tool.coverage.html]
directory = "htmlcov"

[tool.coverage.report]
exclude_also = [
    'def __repr__',
    'if self.debug:',
    'if settings.DEBUG',
    'raise AssertionError',
    'raise NotImplementedError',
    'if 0:',
    'if __name__ == .__main__.:',
    'if TYPE_CHECKING:',
    'class .*\bProtocol\):',
    '@(abc\.)?abstractmethod',
]
